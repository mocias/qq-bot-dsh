<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开 QQ 面板</title><link rel="stylesheet" href="/welcome.css"></head>
<body><main><div class="welcome-brand"><span class="welcome-logo" aria-hidden="true">Q</span><span>QQ RSI<small>本地助手工作台</small></span></div><div class="welcome-divider"></div><span class="welcome-kicker">欢迎回来</span><h1>请重新打开面板</h1>
<p>当前浏览器尚未登录，或服务更新后原登录已经失效。你的配置和记忆仍保存在本机。</p>
<ol><li>打开项目所在文件夹。</li><li>双击 <strong>打开面板.cmd</strong>。</li><li>它会自动使用当前有效的登录链接，无需寻找终端或复制令牌。</li></ol>
<p class="hint">本机部署版的入口在项目根目录；源码版在 standalone 文件夹内。服务尚未启动时，入口会尝试启动面板。它不会自动启动机器人接收。</p>
<p class="hint">如果你习惯在终端启动，也可以使用那里显示的完整登录链接。仅收藏普通地址，换浏览器或服务重启后可能需要重新打开。</p>
</main></body></html>
